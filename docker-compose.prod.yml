services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: insurance-postgres
    restart: always
    environment:
      POSTGRES_DB: insurance_db
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - insurance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance_db
      SPRING_DATASOURCE_USERNAME: insurance_user
      SPRING_DATASOURCE_PASSWORD: insurance_secure_pass_2026
      CORS_ALLOWED_ORIGINS: "*"
    networks:
      - insurance-network

  # 3. React Frontend + Nginx Web Server (Exposed on safe Port 3001)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insurance-frontend
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - insurance-network

networks:
  insurance-network:
    driver: bridge

volumes:
  postgres_data:
