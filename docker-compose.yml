services:
  insurance_postgres:
    container_name: aadhiraksha_insurance_db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-insurance_db}
      POSTGRES_USER: ${DB_USER:-aadhiraksha_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aadhiraksha_secure_password}
    volumes:
      - aadhiraksha_insurance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aadhiraksha_admin} -d ${DB_NAME:-insurance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aadhiraksha_insurance_pgdata:
    name: aadhiraksha_insurance_pgdata
