services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aadhiraksha_insurance_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-insurance_db}
      POSTGRES_USER: ${DB_USER:-aadhiraksha_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aadhiraksha_secure_password}
    volumes:
      - aadhiraksha_insurance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aadhiraksha_admin} -d ${DB_NAME:-insurance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aadhiraksha_network

  # 2. Spring Boot Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aadhiraksha_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-insurance_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aadhiraksha_admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aadhiraksha_secure_password}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailserver}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-465}
      MAILSERVER_API_URL: ${MAILSERVER_API_URL:-http://mailserver:8080}
      MAILSERVER_API_SECRET: ${MAILSERVER_API_SECRET:-AadhirakshaMailSecret2026!}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MSG91_AUTHKEY: "${MSG91_AUTHKEY:-592795AauF41robH6b0689d0P1}"
      MSG91_OTP_ENABLED: "${MSG91_OTP_ENABLED:-true}"
      MSG91_WIDGET_ID: "${MSG91_WIDGET_ID:-366b78695955393733323532}"
      MSG91_WIDGET_TOKEN: "${MSG91_WIDGET_TOKEN:-592795ThlSyisg09zf6b068890P1}"
      MSG91_WHATSAPP_ENABLED: "${MSG91_WHATSAPP_ENABLED:-true}"
      MSG91_WHATSAPP_INTEGRATED_NUMBER: "${MSG91_WHATSAPP_INTEGRATED_NUMBER:-918184840850}"
      MSG91_WHATSAPP_TEMPLATE_NAME: "${MSG91_WHATSAPP_TEMPLATE_NAME:-aadhiraksha_welcome}"
    volumes:
      - aadhiraksha_document_uploads:/app/uploads
    networks:
      - aadhiraksha_network

  # 3. React Frontend + Nginx Web Server (Exposed on safe Port 3001)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aadhiraksha_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - aadhiraksha_network

  # 4. Lightweight Stalwart Mail Server (~50MB RAM single Rust binary)
  mailserver:
    image: stalwartlabs/stalwart:latest
    container_name: aadhiraksha_mailserver
    restart: unless-stopped
    ports:
      - "25:25"       # SMTP
      - "465:465"     # SMTPS (Implicit TLS)
      - "587:587"     # Submission (STARTTLS)
      - "993:993"     # IMAPS (Implicit TLS)
      - "4190:4190"   # ManageSieve
      - "8080:8080"   # HTTP Management / JMAP / Admin Web Console
    environment:
      - STALWART_HOSTNAME=${STALWART_HOSTNAME:-mail.aadhirakshainsurance.com}
      - STALWART_PUBLIC_URL=${STALWART_PUBLIC_URL:-https://mail-admin.aadhirakshainsurance.com}
      - STALWART_ADMIN_SECRET=${STALWART_ADMIN_SECRET:-AadhirakshaMailSecret2026!}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_SECRET:-AadhirakshaMailSecret2026!}
    volumes:
      - ./data/stalwart/etc:/etc/stalwart
      - ./data/stalwart/data:/var/lib/stalwart
    networks:
      - aadhiraksha_network

  # 5. Lightweight SnappyMail Webmail Client (~30MB RAM Alpine container)
  webmail:
    image: djmaze/snappymail:latest
    container_name: aadhiraksha_webmail
    restart: unless-stopped
    ports:
      - "${SNAPPYMAIL_PORT:-8888}:8888"
    volumes:
      - aadhiraksha_snappymail_data:/var/lib/snappymail
    depends_on:
      - mailserver
    networks:
      - aadhiraksha_network

networks:
  aadhiraksha_network:
    name: aadhiraksha_network
    driver: bridge

volumes:
  aadhiraksha_insurance_pgdata:
    name: aadhiraksha_insurance_pgdata
  aadhiraksha_document_uploads:
    name: aadhiraksha_document_uploads
  aadhiraksha_snappymail_data:
    name: aadhiraksha_snappymail_data
