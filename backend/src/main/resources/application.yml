server:
  port: 8080

spring:
  application:
    name: insurance-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/insurance_db}
    username: ${SPRING_DATASOURCE_USERNAME:aadhiraksha_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:aadhiraksha_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:mail.aadhirakshainsurance.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:admin}
    password: ${SPRING_MAIL_PASSWORD:pFLV0mGhXb4Jn5Om}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
            checkserveridentity: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours for CRM Admin, Managers, and Staff
    customer-expiration-ms: 2592000000 # 30 days (720 hours) for Customers & POSP Agents (zero re-OTP friction)

# Firebase Authentication (Phone OTP)
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:aadhiraksha-insurance}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:} # Optional path to serviceAccountKey.json

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8080}

# Corporate Domain Mail Server (Stalwart Container on VPS)
mailserver:
  enabled: ${MAILSERVER_ENABLED:true}
  domain: ${MAILSERVER_DOMAIN:aadhirakshainsurance.com}
  api-url: ${MAILSERVER_API_URL:http://mailserver:8080/api}
  api-secret: ${MAILSERVER_API_SECRET:AadhirakshaMailSecret2026!}
  webmail-url: ${MAILSERVER_WEBMAIL_URL:https://mail.aadhirakshainsurance.com}

# SpringDoc OpenAPI Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

