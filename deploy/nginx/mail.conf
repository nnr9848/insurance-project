# ==============================================================================
# Production Reverse Proxy Configuration for Aadhiraksha Mail Services
# Domains:
#   1. https://mail.aadhirakshainsurance.com (SnappyMail Webmail Client)
#   2. https://webmail.aadhirakshainsurance.com (SnappyMail Alternate Alias)
#   3. https://mail-admin.aadhirakshainsurance.com (Stalwart Admin Console)
# ==============================================================================

# 1. Unified HTTP -> HTTPS Unconditional 301 Redirect for All Mail Subdomains
server {
    listen 80;
    listen [::]:80;
    server_name mail.aadhirakshainsurance.com webmail.aadhirakshainsurance.com mail-admin.aadhirakshainsurance.com;

    return 301 https://$host$request_uri;
}

# 2. SnappyMail Web Client (mail. & webmail.)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.aadhirakshainsurance.com webmail.aadhirakshainsurance.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/mail.aadhirakshainsurance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.aadhirakshainsurance.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header HTTPS on;
    }
}

# 3. Stalwart Server Admin Console (mail-admin.)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail-admin.aadhirakshainsurance.com;

    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/mail.aadhirakshainsurance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.aadhirakshainsurance.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
