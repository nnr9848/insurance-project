; SnappyMail Webmail Configuration for Aadhiraksha Insurance
; Enables seamless login with BOTH username ('nagaraju') and full email ('nagaraju@aadhirakshainsurance.com')

[webmail]
title = "Aadhiraksha Mail"
loading_description = "Aadhiraksha Mail"
favicon_url = ""

[login]
; Default domain applied when a user types just their username without @
default_domain = "aadhirakshainsurance.com"
determine_user_domain = "aadhirakshainsurance.com"

; Allow users to log in with either 'username' or 'username@aadhirakshainsurance.com'
allow_languages_on_login = Off
sign_me_auto = "DefaultIsForm"

[security]
custom_server_signature = "AadhirakshaMail/2.0"
